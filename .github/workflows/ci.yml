name: ci

# The tests that need no audio server run on every push and pull request, then the RPMs are built as
# artifacts, on both architectures, and installed in a clean container. Nothing is signed or published
# here: release.yml is a release, run from a version tag, and its dry run is the last job.
#
# The protocol library, the mod-host RPMs and the RPM build are the composite actions of
# FreeMixer/.github. The real CLAP worker the jack test drives, and its fixtures, are the omx-clap-host and
# omx-clap-host-tests packages of the OpenMixer channel, installed by dnf builddep / apt-get build-dep from the
# floor the spec and debian/control declare; nothing of omx-clap-core is checked out or built here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The packages and their smoke tests are built from the whole tree but fuzz/, bench/, the top-level pages and the licence:
  # a pull request that changes only those skips them (the jobs below that need this one). main and tags run them always.
  changes:
    name: what the pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The checkout of a pull request is its merge commit and the first parent is the base, so this diff is what the
      # pull request adds. Any other event, or a diff that cannot be read, says true: main and tags always run it.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] || ! changed=$(git diff --name-only HEAD^1 HEAD) || [ -z "$changed" ]; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          if grep -qvE '^(fuzz/|bench/|[^/]*\.md$|COPYING$|LICENSE$|\.github/workflows/fuzz\.yml$)' <<<"$changed"; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

  private-refs:
    name: no tracked file points into a private repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: make private-refs
        run: make private-refs

  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:44
      # the jack test runs the daemon and its workers in a user, net, pid and mount namespace of their own
      # CAP_SYS_RESOURCE lets the probe test raise RLIMIT_RTPRIO and RLIMIT_MEMLOCK as LimitRTPRIO= and LimitMEMLOCK= do,
      # so it measures at the highest SCHED_FIFO priority with its memory locked. Not CAP_SYS_NICE: the worker_env test
      # needs a daemon that cannot lower a nice
      options: --cap-add SYS_ADMIN --cap-add SYS_RESOURCE --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git dnf5-plugins gcc make python3 pkgconf-pkg-config clap-devel lv2-devel \
            pipewire-jack-audio-connection-kit-devel pipewire pipewire-utils iproute util-linux procps-ng diffutils python3-jsonschema

      - uses: actions/checkout@v4

      # the OpenMixer channel: where the BuildRequires Fedora does not carry (omx-clap-host-tests) come from
      - name: Add the OpenMixer channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      # the worker and the fixtures: omx-clap-host-tests Requires omx-clap-host, so this installs both
      - name: Install the build dependencies from the channel
        run: dnf builddep -y --setopt=retries=10 packaging/plugin-hostd.spec

      # the library, corpus and README of mod-host with the patches FreeMixer/.github carries (packaging/mod-host),
      # the same code as the mod-host-protocol packages: track_info, remote pages, param_info, NUL-framed commands
      - uses: FreeMixer/.github/.github/actions/mod-host-protocol@v1

      - name: Build
        run: make

      # the daemon against workers that die on cue, then the declaration: the generated files are current, the JSON
      # satisfies its schema, a C consumer compiles against the installed header, and changing the declaration in a
      # scratch copy moves the daemon and the docs
      - name: Test the daemon against workers that die on cue, and the declared protocol
        # the container holds the grant: a real-time or memory-lock arm of the probe test that cannot be taken fails
        env:
          PROBE_REQUIRE_REALTIME: "1"
        run: make test

      # the package as a reader of the installed contract directory reads it: install-contract into a staging directory,
      # then the installed omx-contract (the builddep above) validates it with its own tables and omx-clap-core's; red on
      # any table its schema refuses, and red when the command is absent (#165)
      - name: Validate the staged contract directory with the installed omx-contract
        run: make check-contract-dir

      # panel_get on the wire: the installed omx-clap-scan (0.20.0 or later, which the test checks) reads the panel of a
      # plugin of omx-plugins-clap that publishes one and of omx-clap-host-tests' fake compressor, which publishes none
      - name: Test panel_get against the installed scanner and real plugins
        run: |
          dnf install -y --setopt=retries=10 omx-plugins-clap
          make test-panel-wire

      # mod-host itself, the LV2 worker, from the OpenMixer channel: the build the RPM job packages, with the patches
      # FreeMixer/.github carries. The floor is the one the spec requires of the protocol library.
      - name: Install mod-host from the channel
        run: |
          set -euo pipefail
          dnf install -y --setopt=retries=10 mod-host
          rpm -q mod-host mod-host-protocol
          floor=$(sed -n 's/^Requires:.*mod-host-protocol.*>=[[:space:]]*\([^[:space:]]*\).*/\1/p' packaging/plugin-hostd.spec | head -n 1)
          test -n "$floor"
          have=$(rpm -q --qf '%{VERSION}-%{RELEASE}' mod-host)
          test "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -n 1)" = "$floor" || { echo "mod-host $have is below the floor $floor"; exit 1; }

      # The daemon with the installed workers over jack, in a PipeWire of its own: omx-clap-host for CLAP and mod-host
      # for LV2, driving the fixture bundle of this repository (a stereo gain, tests/lv2_fixture.c) with the whole tests/
      # directory as the world: a few dozen files that are no bundle, which lilv warns about one by one before mod-host
      # says ready, and a pool worker must still start under that (#105). It needs a private user namespace with its own /proc; a
      # runner that refuses one cannot run it, and the step fails (tests/ci_guards.py holds both branches to that). The
      # LV2 steps are required to have run: a run that skipped them fails here.
      - name: Test the daemon with real workers over jack, CLAP and LV2, then break every guard on purpose
        run: |
          set -euo pipefail
          export FAKE_COMPRESSOR_CLAP=/usr/libexec/omx-clap-host/tests/fake_compressor.clap
          export JACK_METER_SOURCE=/usr/libexec/omx-clap-host/tests/jack_meter_source
          export FAKE_CLAP=/usr/libexec/omx-clap-host/tests/fake.clap
          make tests/plugin-hostd-fixture.lv2/plugin-hostd-fixture.so
          export MOD_HOST=/usr/bin/mod-host LV2_DIR=$PWD/tests LV2_URI=urn:plugin-hostd:test:stereo
          export LV2_BUNDLE=plugin-hostd-fixture.lv2 LV2_PARAM=gain
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack OMX_CLAP_HOST=/usr/bin/omx-clap-host 2>&1 | tee test-jack.log
            for t in mod_host_scenarios_pass_unchanged_with_an_lv2_worker lv2_own_worker_sees_one_bundle_and_replays_after_a_kill; do
              grep -qx "ok   $t" test-jack.log || { echo "the LV2 step $t did not run"; exit 1; }
            done
            OMX_CLAP_HOST=/usr/bin/omx-clap-host make sabotage 2>&1 | tee sabotage.log
            if grep -q 'skip sabotage (no LV2 bundle' sabotage.log; then echo 'an LV2 sabotage was skipped'; exit 1; fi
          else
            echo "::error::test-jack did not run: this runner refuses a private user and pid namespace with its own /proc"
            exit 1
          fi

  jack2:
    name: build and test over JACK2's jackd (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
      # the jack test runs the daemon and its workers in a user, net, pid and mount namespace of their own
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git gcc make python3 pkg-config cmake \
            dpkg-dev debhelper build-essential lintian jackd2 libjack-jackd2-dev jack-example-tools \
            iproute2 util-linux procps

      - uses: actions/checkout@v4

      # the OpenMixer channel: where the Build-Depends Debian does not carry (omx-clap-host-tests) come from
      - name: Add the OpenMixer channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      # the worker and the fixtures: omx-clap-host-tests Depends on omx-clap-host, so this installs both
      - name: Install the build dependencies from the channel
        run: apt-get build-dep -y --no-install-recommends ./

      # the library, corpus and README of mod-host with the patches FreeMixer/.github carries (packaging/mod-host),
      # the same code as the mod-host-protocol packages: track_info, remote pages, param_info, NUL-framed commands
      - uses: FreeMixer/.github/.github/actions/mod-host-protocol@v1

      # the CLAP headers, which Debian does not package either: built and installed from the pin of
      # FreeMixer/.github, the same one the RPM and DEB builds of the CLAP worker use
      - uses: FreeMixer/.github/.github/actions/deb-deps@v1
        with:
          names: clap-headers

      - name: Build
        run: make

      # The daemon with the real worker over JACK2's own jackd, in the private namespace jack_e2e.sh builds.
      # It needs a private user namespace with its own /proc; a runner that refuses one cannot run it, and the
      # step fails.
      - name: Test the daemon with a real worker over JACK2's jackd
        run: |
          export FAKE_COMPRESSOR_CLAP=/usr/libexec/omx-clap-host/tests/fake_compressor.clap
          export JACK_METER_SOURCE=/usr/libexec/omx-clap-host/tests/jack_meter_source
          export FAKE_CLAP=/usr/libexec/omx-clap-host/tests/fake.clap
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack2 OMX_CLAP_HOST=/usr/bin/omx-clap-host
          else
            echo "::error::test-jack2 did not run: this runner refuses a private user and pid namespace with its own /proc"
            exit 1
          fi

      - name: Name what this job does not run
        run: |
          echo "The LV2 steps of test-jack2 are NOT run here: mod-host itself (not just its protocol library) is not built in this job, and Debian does not package it."
          echo "An aarch64 run of this job is not here either: this is x86_64 only, a separate step for later."

  rpm:
    name: RPMs (fc44, ${{ matrix.arch }}), installed in a clean root
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["x86_64"]' || '["x86_64", "aarch64"]') }}
    container:
      image: fedora:44
      # the clean root gets a /proc and a /dev of its own
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip python3 pipewire-jack-audio-connection-kit-devel

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the OpenMixer channel: where the BuildRequires Fedora does not carry (omx-clap-host-tests) come from
      - name: Add the OpenMixer channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - uses: FreeMixer/.github/.github/actions/mod-host-rpms@v1

      - uses: FreeMixer/.github/.github/actions/build-rpm@v1

      - name: Check the file lists
        run: |
          set -euo pipefail
          for rpm in rpms/plugin-hostd-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$rpm" | grep -v -e '^d' -e '/\.build-id/' | cut -d' ' -f2 | sort > files.txt
            printf '%s\n' /usr/bin/plugin-hostd /usr/bin/plugin-hostd-probe /usr/share/man/man1/plugin-hostd.1.gz \
              /usr/share/man/man1/plugin-hostd-probe.1.gz \
              /usr/share/doc/plugin-hostd/README.md /usr/share/licenses/plugin-hostd/COPYING \
              /usr/share/plugin-hostd/protocol.json /usr/share/plugin-hostd/mod-host.json | sort > expected.txt
            diff -u expected.txt files.txt
            rpm -qp --requires "$rpm" | tee requires.txt
            grep -q 'libmod-host-protocol.so.0' requires.txt
            grep -qx 'mod-host-protocol(.*) >= 0.10.6.f14a230-11.1' requires.txt
            grep -qx "plugin-hostd-contract = $(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpm")" requires.txt
            rpm -qp --recommends "$rpm" | tee recommends.txt
            grep -q '^mod-host' recommends.txt
            grep -q '^omx-clap-host' recommends.txt
          done
          # the development package: the headers a consumer includes, its pkg-config file, the schema of the JSON
          for rpm in rpms/plugin-hostd-devel-[0-9]*.noarch.rpm; do
            rpm -qlp "$rpm"
            rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$rpm" | grep -v '^d' | cut -d' ' -f2 | sort > files.txt
            printf '%s\n' /usr/include/plugin-hostd/protocol.h /usr/include/plugin-hostd/pin.h /usr/share/pkgconfig/plugin-hostd.pc \
              /usr/include/plugin-hostd/plugin_hostd_host_verbs.h /usr/include/plugin-hostd/plugin_hostd_vocabulary.h \
              /usr/include/plugin-hostd/omx_clap_core_host_verbs.h /usr/include/plugin-hostd/omx_clap_core_vocabulary.h \
              /usr/share/plugin-hostd/protocol.schema.json /usr/share/plugin-hostd/probe-output.schema.json /usr/share/plugin-hostd/preset.schema.json \
              /usr/share/licenses/plugin-hostd-devel/COPYING | sort > expected.txt
            diff -u expected.txt files.txt
            rpm -qp --requires "$rpm" | grep -qx "plugin-hostd-contract = $(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpm")"
          done
          # the contract package: the contract directory's files, which readers read at run time, noarch
          for rpm in rpms/plugin-hostd-contract-[0-9]*.noarch.rpm; do
            rpm -qlp "$rpm"
            rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$rpm" | grep -v '^d' | cut -d' ' -f2 | sort > files.txt
            printf '%s\n' /usr/share/omx-contract/contract.d/3/plugin-hostd/MANIFEST.json \
              /usr/share/omx-contract/contract.d/3/plugin-hostd/formats/clap.json \
              /usr/share/omx-contract/contract.d/3/plugin-hostd/formats/lv2.json \
              /usr/share/omx-contract/contract.d/3/plugin-hostd/history.json \
              /usr/share/omx-contract/contract.d/3/plugin-hostd/grouping.json \
              /usr/share/omx-contract/contract.d/3/plugin-hostd/verbs.json \
              /usr/share/licenses/plugin-hostd-contract/COPYING | sort > expected.txt
            diff -u expected.txt files.txt
          done
          ls rpms/plugin-hostd-contract-[0-9]*.noarch.rpm
          # the tests package: the fake worker, where plugin-qualify's pins-file test finds it
          for rpm in rpms/plugin-hostd-tests-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$rpm" | grep -v -e '^d' -e '/\.build-id/' | cut -d' ' -f2 | sort > files.txt
            printf '%s\n' /usr/libexec/plugin-hostd/tests/fake-host /usr/libexec/plugin-hostd/tests/lib/protocol.sh /usr/libexec/plugin-hostd/tests/lib/plugin_hostd_client.py \
              /usr/share/licenses/plugin-hostd-tests/COPYING | sort > expected.txt
            diff -u expected.txt files.txt
            # tied to the same build: the requirement names the exact version-release and the isa of this very package
            case "${{ matrix.arch }}" in x86_64) isa=x86-64 ;; aarch64) isa=aarch-64 ;; *) echo "no isa for ${{ matrix.arch }}"; exit 1 ;; esac
            vr=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpm")
            rpm -qp --requires "$rpm" | grep -qxF "plugin-hostd($isa) = $vr"
          done
          ls rpms/plugin-hostd-tests-[0-9]*.${{ matrix.arch }}.rpm
          ls rpms/plugin-hostd-*.src.rpm

      # the worker the smoke test runs the installed daemon against
      - name: Build the fake worker
        run: make tests/fake-host

      - uses: FreeMixer/.github/.github/actions/install-clean@v1
        with:
          rpms: |
            mod-host-rpms/mod-host-[0-9]*.rpm
            mod-host-rpms/mod-host-protocol-[0-9]*.rpm
            rpms/plugin-hostd-[0-9]*.${{ matrix.arch }}.rpm
            rpms/plugin-hostd-contract-[0-9]*.noarch.rpm
            rpms/plugin-hostd-tests-[0-9]*.${{ matrix.arch }}.rpm
          packages: python3

      - name: The daemon reports the version of its package and resolves its libraries
        run: |
          set -euo pipefail
          version=$(rpm --root /tmp/clean-root -q --qf '%{VERSION}' plugin-hostd)
          chroot /tmp/clean-root plugin-hostd -V | tee v.txt
          grep -q "version: $version\$" v.txt
          chroot /tmp/clean-root ldd /usr/bin/plugin-hostd | tee ldd.txt
          ! grep -q 'not found' ldd.txt
          grep -q 'libmod-host-protocol\.so\.0 => /' ldd.txt

      # the readiness line, the placement, the crashes and the respawns, of the installed binary
      - name: The installed daemon against the fake worker
        run: |
          set -euo pipefail
          mkdir -p /tmp/clean-root/smoke
          cp -r tests /tmp/clean-root/smoke/tests
          # the scan an add runs reads the format tables and the recorded field dumps beside the tests
          cp -r data /tmp/clean-root/smoke/data
          # the tests read the declared protocol from the installed package's JSON
          chroot /tmp/clean-root env PLUGIN_HOSTD=/usr/bin/plugin-hostd PROBE=/usr/bin/plugin-hostd-probe FAKE_HOST=/smoke/tests/fake-host \
            PLUGIN_HOSTD_PROTOCOL=/usr/share/plugin-hostd/protocol.json python3 /smoke/tests/daemon_test.py

      # the installed fake worker prints its layout and serves the daemon, as plugin-qualify drives it
      - name: The installed fake worker
        run: |
          set -euo pipefail
          chroot /tmp/clean-root /usr/libexec/plugin-hostd/tests/fake-host -L | tee layout.txt
          test -s layout.txt
          # and the protocol clients it ships load
          chroot /tmp/clean-root bash -c '. /usr/libexec/plugin-hostd/tests/lib/protocol.sh && type protocol_send protocol_expect protocol_wait_ready send'
          chroot /tmp/clean-root python3 -c 'import sys; sys.path.insert(0, "/usr/libexec/plugin-hostd/tests/lib"); import plugin_hostd_client'
          chroot /tmp/clean-root env PLUGIN_HOSTD=/usr/bin/plugin-hostd PROBE=/usr/bin/plugin-hostd-probe FAKE_HOST=/usr/libexec/plugin-hostd/tests/fake-host \
            PLUGIN_HOSTD_PROTOCOL=/usr/share/plugin-hostd/protocol.json python3 /smoke/tests/daemon_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-hostd-rpms-fc44-${{ matrix.arch }}
          path: rpms/plugin-hostd-[0-9]*.rpm
          if-no-files-found: error
          retention-days: 1

  deb:
    name: DEBs (${{ matrix.suite }}, ${{ matrix.arch }}), built and linted
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the OpenMixer channel: where the Build-Depends Debian does not carry (omx-clap-host-tests) come from
      - name: Add the OpenMixer channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - uses: FreeMixer/.github/.github/actions/deb-deps@v1

      - uses: FreeMixer/.github/.github/actions/build-deb@v1

      # the data packages plugin-hostd-contract depends on are the channel's, not Debian's: the clean container
      # installs them from here, like the protocol library; omx-contract too, whose schema reads the tables (#165)
      - name: Fetch the contract data packages of the channel
        run: |
          set -euo pipefail
          mkdir -p dep-debs
          (cd dep-debs && apt-get download omx-clap-core-contract omx-contract-data omx-contract)

      # what the smoke test runs the installed package against, built here for the architecture
      - name: Build the smoke test fixtures
        run: |
          set -euo pipefail
          make tests/fake-host
          mkdir -p smoke
          cp -r tests smoke/tests
          cp -r data smoke/data

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-hostd-ci-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            dep-debs/libmod-host-protocol0_*.deb
            dep-debs/omx-clap-core-contract_*.deb
            dep-debs/omx-contract-data_*.deb
            dep-debs/omx-contract_*.deb
            smoke
          if-no-files-found: error
          retention-days: 1

  deb-smoke:
    name: DEBs (${{ matrix.suite }}, ${{ matrix.arch }}), installed in a clean container
    needs: deb
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    # nothing but the distribution: a dependency the package forgot to declare is missing here
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-hostd-ci-debs-${{ matrix.suite }}-${{ matrix.arch }}

      - name: Install the package with its dependencies from the distribution
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ./debs/plugin-hostd_*.deb ./debs/plugin-hostd-contract_*.deb ./debs/plugin-hostd-dev_*.deb ./debs/plugin-hostd-tests_*.deb ./dep-debs/libmod-host-protocol0_*.deb ./dep-debs/omx-clap-core-contract_*.deb ./dep-debs/omx-contract-data_*.deb ./dep-debs/omx-contract_*.deb python3
          dpkg -L plugin-hostd-dev | tee dev.txt
          grep -qx /usr/include/plugin-hostd/protocol.h dev.txt
          grep -qx /usr/include/plugin-hostd/plugin_hostd_host_verbs.h dev.txt
          grep -qx /usr/include/plugin-hostd/plugin_hostd_vocabulary.h dev.txt
          grep -qx /usr/include/plugin-hostd/pin.h dev.txt
          grep -qx /usr/share/pkgconfig/plugin-hostd.pc dev.txt
          ! grep -q /usr/share/omx-contract/ dev.txt
          # the contract directory's files are the noarch contract package's, which the daemon and the headers depend on
          test "$(dpkg-deb -f debs/plugin-hostd-contract_*.deb Architecture)" = all
          dpkg -L plugin-hostd-contract | tee contract.txt
          for f in MANIFEST.json formats/clap.json formats/lv2.json grouping.json history.json verbs.json; do
            grep -qx "/usr/share/omx-contract/contract.d/3/plugin-hostd/$f" contract.txt
          done
          dpkg-deb -f debs/plugin-hostd-contract_*.deb Breaks Replaces | tee breaks.txt
          test "$(grep -c '^\(Breaks\|Replaces\): plugin-hostd-dev (<< ' breaks.txt)" = 2
          for p in plugin-hostd plugin-hostd-dev; do
            dpkg-deb -f debs/${p}_*.deb Depends | grep -q 'plugin-hostd-contract (= '
          done
          dpkg -L plugin-hostd | grep -qx /usr/share/plugin-hostd/protocol.json
          dpkg -L plugin-hostd | grep -qx /usr/share/plugin-hostd/mod-host.json
          dpkg -L plugin-hostd-tests | tee tests.txt
          grep -qx /usr/libexec/plugin-hostd/tests/fake-host tests.txt
          grep -qx /usr/libexec/plugin-hostd/tests/lib/protocol.sh tests.txt
          grep -qx /usr/libexec/plugin-hostd/tests/lib/plugin_hostd_client.py tests.txt
          dpkg -s libmod-host-protocol0 | grep '^Status: install ok installed'
          dpkg-deb -f debs/plugin-hostd_*.deb Depends | tee depends.txt
          grep -qF 'libmod-host-protocol0 (>= 0.1.0-6~fmx)' depends.txt

      - name: The installed fake worker prints its layout
        run: |
          set -euo pipefail
          /usr/libexec/plugin-hostd/tests/fake-host -L | tee layout.txt
          test -s layout.txt

      - name: The daemon reports the version of its package and resolves its libraries
        run: |
          set -euo pipefail
          version=$(dpkg-query -W -f='${Version}' plugin-hostd)
          plugin-hostd -V | tee v.txt
          grep -q "version: ${version%%~*}\$" v.txt
          ldd /usr/bin/plugin-hostd | tee ldd.txt
          ! grep -q 'not found' ldd.txt
          grep -q 'libmod-host-protocol\.so\.0 => /' ldd.txt

      # the readiness line, the placement, the crashes and the respawns, of the installed binary
      - name: The installed daemon against the fake worker
        run: |
          set -euo pipefail
          # an artifact does not keep the executable bit
          chmod +x smoke/tests/fake-host
          PLUGIN_HOSTD=/usr/bin/plugin-hostd PROBE=/usr/bin/plugin-hostd-probe FAKE_HOST=$PWD/smoke/tests/fake-host \
            PLUGIN_HOSTD_PROTOCOL=/usr/share/plugin-hostd/protocol.json python3 smoke/tests/daemon_test.py

  # docs/own-host.md, command by command, as a reader would type it: a clean Debian with nothing but what the page
  # lists, the published packages of the OpenMixer channel, on both architectures (arm64 is a native runner).
  # A step of the page that stops working fails this job. The page's LV2 block runs an LV2 URI with
  # `lv2_worker omx-clap-host`, and --audio then measures the gain of a sine that went through that instance.
  own-host-page:
    name: own-host page (${{ matrix.suite }}, ${{ matrix.arch }}), run as written in a clean container
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      # what a Debian base image lacks and the page assumes: sudo and curl, which Raspberry Pi OS and Zynthian carry,
      # and python3 for the reader of the page
      - name: Prepare the clean container
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl sudo python3

      - uses: actions/checkout@v4

      - name: The reader stops on a wrong reply
        run: python3 tests/own_host_page.py selftest

      - name: The page's commands, the LV2 plugin included, and its audio
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR=/tmp/xdg XDG_STATE_HOME=/tmp/state
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_STATE_HOME" /tmp/own-host
          cd /tmp/own-host
          python3 "$GITHUB_WORKSPACE/tests/own_host_page.py" run --audio
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"

  # The release workflow as a tag would run it, publishing nothing: both architectures build through the
  # shared workflow and an unsigned tree is assembled. The caller grants what the called workflow may ask
  # for; its publish and release steps do not run here.
  release-dry-run:
    name: release workflow, dry run
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # aarch64/arm64 build at release only
