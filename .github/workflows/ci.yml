name: ci

# The tests that need no audio server run on every push and pull request, then the RPMs are built as
# artifacts, on both architectures, and installed in a clean container. Nothing is signed or published
# here: release.yml is a release, run from a version tag, and its dry run is the last job.
#
# The protocol library, the mod-host RPMs and the RPM build are the composite actions of
# FreeMixer/.github; OMX_CLAP_HOST_REF is the commit of omx-clap-host whose worker the jack test drives.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  OMX_CLAP_HOST_REF: a58ad8478c92c5178ebfbfbffb30a75414dddff8

jobs:
  changelog:
    name: CHANGELOG.md agrees with the spec and debian/changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: FreeMixer/.github/.github/actions/changelog@packaging-changelog

  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
      # the jack test runs the daemon and its workers in a user, net, pid and mount namespace of their own
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git gcc make python3 pkgconf-pkg-config clap-devel \
            pipewire-jack-audio-connection-kit-devel pipewire pipewire-utils iproute util-linux procps-ng diffutils python3-jsonschema

      - uses: actions/checkout@v4

      # the library, corpus and README of mod-host 0.10.6-3-fmx, which carry track_info, remote pages and param_info
      - uses: FreeMixer/.github/.github/actions/mod-host-protocol@main
        with:
          ref: ce0d247dce860051456e45d5e4e4e70d5884629f

      - name: Build
        run: make

      # the daemon against workers that die on cue, then the declaration: the generated files are current, the JSON
      # satisfies its schema, a C consumer compiles against the installed header, and changing the declaration in a
      # scratch copy moves the daemon and the docs
      - name: Test the daemon against workers that die on cue, and the declared protocol
        run: make test

      # The real worker for CLAP, built from the pinned omx-clap-host.
      - uses: actions/checkout@v4
        with:
          repository: FreeMixer/omx-clap-host
          ref: ${{ env.OMX_CLAP_HOST_REF }}
          path: omx-clap-host

      # the worker, and its fixtures: a plugin that reads clap.track-info, a compressor that reports meters, and a
      # constant jack source
      - name: Build the CLAP worker
        run: make -C omx-clap-host PLUGIN_HOSTD_DIR=$PWD omx-clap-host tests/fake.clap tests/fake_compressor.clap tests/jack_meter_source

      # The daemon with the real worker over jack, in a PipeWire of its own. It needs a private user
      # namespace with its own /proc; a runner that refuses one cannot run it, and the step says so.
      - name: Test the daemon with a real worker over jack, then break every guard on purpose
        run: |
          export FAKE_COMPRESSOR_CLAP=$PWD/omx-clap-host/tests/fake_compressor.clap
          export JACK_METER_SOURCE=$PWD/omx-clap-host/tests/jack_meter_source
          export FAKE_CLAP=$PWD/omx-clap-host/tests/fake.clap
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack OMX_CLAP_HOST=$PWD/omx-clap-host/omx-clap-host
            OMX_CLAP_HOST=$PWD/omx-clap-host/omx-clap-host make sabotage
          else
            echo "::warning::test-jack SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
            make sabotage
          fi

      - name: Name what this job does not run
        run: |
          echo "The LV2 steps of test-jack are NOT run here: they need mod-host and an LV2 bundle (MOD_HOST, LV2_DIR, LV2_URI, LV2_BUNDLE, LV2_PARAM)."
          echo "They stay in the Makefile for the desk."

  rpm:
    name: RPMs (fc44, ${{ matrix.arch }}), installed in a clean root
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: fedora:44
      # the clean root gets a /proc and a /dev of its own
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip python3 pipewire-jack-audio-connection-kit-devel

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FreeMixer/.github/.github/actions/mod-host-rpms@main

      - uses: FreeMixer/.github/.github/actions/build-rpm@main

      - name: Check the file lists
        run: |
          set -euo pipefail
          for rpm in rpms/plugin-hostd-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$rpm" | grep -v -e '^d' -e '/\.build-id/' | cut -d' ' -f2 | sort > files.txt
            printf '%s\n' /usr/bin/plugin-hostd /usr/share/man/man1/plugin-hostd.1.gz \
              /usr/share/doc/plugin-hostd/README.md /usr/share/licenses/plugin-hostd/COPYING \
              /usr/share/plugin-hostd/protocol.json | sort > expected.txt
            diff -u expected.txt files.txt
            rpm -qp --requires "$rpm" | tee requires.txt
            grep -q 'libmod-host-protocol.so.0' requires.txt
            rpm -qp --recommends "$rpm" | tee recommends.txt
            grep -q '^mod-host' recommends.txt
            grep -q '^omx-clap-host' recommends.txt
          done
          # the development package: the header a consumer includes, its pkg-config file, the schema of the JSON
          for rpm in rpms/plugin-hostd-devel-[0-9]*.noarch.rpm; do
            rpm -qlp "$rpm"
            rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$rpm" | grep -v '^d' | cut -d' ' -f2 | sort > files.txt
            printf '%s\n' /usr/include/plugin-hostd/protocol.h /usr/include/plugin-hostd/pin.h /usr/share/pkgconfig/plugin-hostd.pc \
              /usr/share/plugin-hostd/protocol.schema.json /usr/share/licenses/plugin-hostd-devel/COPYING | sort > expected.txt
            diff -u expected.txt files.txt
          done
          ls rpms/plugin-hostd-*.src.rpm

      # the worker the smoke test runs the installed daemon against
      - name: Build the fake worker
        run: make tests/fake-host

      - uses: FreeMixer/.github/.github/actions/install-clean@main
        with:
          rpms: |
            mod-host-rpms/mod-host-[0-9]*.rpm
            mod-host-rpms/mod-host-protocol-[0-9]*.rpm
            rpms/plugin-hostd-[0-9]*.${{ matrix.arch }}.rpm
          packages: python3

      - name: The daemon reports the version of its package and resolves its libraries
        run: |
          set -euo pipefail
          version=$(rpm --root /tmp/clean-root -q --qf '%{VERSION}' plugin-hostd)
          chroot /tmp/clean-root plugin-hostd -V | tee v.txt
          grep -q "version: $version\$" v.txt
          chroot /tmp/clean-root ldd /usr/bin/plugin-hostd | tee ldd.txt
          ! grep -q 'not found' ldd.txt
          grep -q 'libmod-host-protocol\.so\.0 => /' ldd.txt

      # the readiness line, the placement, the crashes and the respawns, of the installed binary
      - name: The installed daemon against the fake worker
        run: |
          set -euo pipefail
          mkdir -p /tmp/clean-root/smoke
          cp -r tests /tmp/clean-root/smoke/tests
          # the tests read the declared protocol from the installed package's JSON
          chroot /tmp/clean-root env PLUGIN_HOSTD=/usr/bin/plugin-hostd FAKE_HOST=/smoke/tests/fake-host \
            PLUGIN_HOSTD_PROTOCOL=/usr/share/plugin-hostd/protocol.json python3 /smoke/tests/daemon_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-hostd-rpms-fc44-${{ matrix.arch }}
          path: rpms/plugin-hostd-[0-9]*.rpm
          if-no-files-found: error
          retention-days: 1

  deb:
    name: DEBs (${{ matrix.suite }}, ${{ matrix.arch }}), built and linted
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64, arm64]
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FreeMixer/.github/.github/actions/deb-deps@main

      - uses: FreeMixer/.github/.github/actions/build-deb@main

      # what the smoke test runs the installed package against, built here for the architecture
      - name: Build the smoke test fixtures
        run: |
          set -euo pipefail
          make tests/fake-host
          mkdir -p smoke
          cp -r tests smoke/tests

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-hostd-ci-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            dep-debs/libmod-host-protocol0_*.deb
            smoke
          if-no-files-found: error
          retention-days: 1

  deb-smoke:
    name: DEBs (${{ matrix.suite }}, ${{ matrix.arch }}), installed in a clean container
    needs: deb
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64, arm64]
    # nothing but the distribution: a dependency the package forgot to declare is missing here
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-hostd-ci-debs-${{ matrix.suite }}-${{ matrix.arch }}

      - name: Install the package with its dependencies from the distribution
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ./debs/plugin-hostd_*.deb ./debs/plugin-hostd-dev_*.deb ./dep-debs/libmod-host-protocol0_*.deb python3
          dpkg -L plugin-hostd-dev | tee dev.txt
          grep -qx /usr/include/plugin-hostd/protocol.h dev.txt
          grep -qx /usr/include/plugin-hostd/pin.h dev.txt
          grep -qx /usr/share/pkgconfig/plugin-hostd.pc dev.txt
          dpkg -L plugin-hostd | grep -qx /usr/share/plugin-hostd/protocol.json
          dpkg -s libmod-host-protocol0 | grep '^Status: install ok installed'

      - name: The daemon reports the version of its package and resolves its libraries
        run: |
          set -euo pipefail
          version=$(dpkg-query -W -f='${Version}' plugin-hostd)
          plugin-hostd -V | tee v.txt
          grep -q "version: ${version%%~*}\$" v.txt
          ldd /usr/bin/plugin-hostd | tee ldd.txt
          ! grep -q 'not found' ldd.txt
          grep -q 'libmod-host-protocol\.so\.0 => /' ldd.txt

      # the readiness line, the placement, the crashes and the respawns, of the installed binary
      - name: The installed daemon against the fake worker
        run: |
          set -euo pipefail
          # an artifact does not keep the executable bit
          chmod +x smoke/tests/fake-host
          PLUGIN_HOSTD=/usr/bin/plugin-hostd FAKE_HOST=$PWD/smoke/tests/fake-host \
            PLUGIN_HOSTD_PROTOCOL=/usr/share/plugin-hostd/protocol.json python3 smoke/tests/daemon_test.py

  # The release workflow as a tag would run it, publishing nothing: both architectures build through the
  # shared workflow and an unsigned tree is assembled. The caller grants what the called workflow may ask
  # for; its publish and release steps do not run here.
  release-dry-run:
    name: release workflow, dry run
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      publish: false
