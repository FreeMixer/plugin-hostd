# The documentation site: its sections, in navigation order, and the entries of each.
# tools/site/build.mjs reads this file; a new page is one entry here, and no code changes.
#
# An entry is one of:
#   page: <path under docs/>   a page of this repository
#   url: <address>             a page elsewhere (another repository's docs, a file on GitHub)
# with a title, an optional blurb, and `pending: true` for a page that is not in docs/ yet. A pending page is shown
# as "coming: <title>" with no link; when the page arrives the site links it, and the build says to drop the flag.
# A page entry without the flag whose file is missing fails the build, by name.
#
# The landing page is docs/index.md. Its paragraph {{captures}} is replaced by the row of captures below; a capture
# whose file is not in docs/ yet is pending, and shown as its caption alone.
title: plugin-hostd technical manual

landing:
  page: index.md
  captures:
    - src: zynthian/evidence/series/04-plugin-hostd-engine/controller-page.png
      caption: A controller page of the plugin-hostd engine
      pending: true
    - src: zynthian/evidence/series/08-modgui/modgui.png
      caption: The same plugin's MOD GUI, from the same layout
      pending: true
    - src: zynthian/evidence/series/05a-menu-figures/menu.png
      caption: The plugin menu with the qualification figures
      pending: true

sections:
  - id: start
    title: Start here
    page: start-here.md
    blurb: One page that says what plugin-hostd is, what it hosts and how it runs, in four paragraphs.
    entries:
      - page: from-file-to-page.md
        title: From a plugin file to a page on the screen
        blurb: The five stages, with an instrument as the example.
      - page: start-here.md
        title: plugin-hostd in four paragraphs

  - id: zynthian
    title: The Zynthian use case
    blurb: From a plugin file to a page, then the image and its first boot, how to use it in Zynthian, the instruments, the measurements, the upstream patch series and the acceptance report.
    entries:
      - page: zynthian/status.md
        title: Where this stands
        blurb: What is in place for Zynthian today, and what is still incomplete, why and what closes it.
      - page: zynthian/digital-proofs.md
        title: Digital proofs on the Pi 5
        blurb: Instruments, presets, snapshot and Surge XT voices measured at JACK ports on the Pi, with what failed and why.
      - page: from-file-to-page.md
        title: From a plugin file to a page
      - page: zynthian/image.md
        title: "Try it: the image, its first boot, and installing on an existing system"
      - page: zynthian/captures.md
        title: "How to use it in Zynthian: the menus, the pages and the MOD GUIs"
      - page: zynthian/instruments.md
        title: "Instruments: voices across the cores"
      - page: zynthian/benchmarks.md
        title: Benchmarks
      - page: zynthian/tradeoffs.md
        title: Trade-offs
      - page: zynthian/stress.md
        title: The stress run
      - page: zynthian/upstream-series.md
        title: The upstream patch series
      - page: zynthian/acceptance-report.md
        title: The acceptance report
      - page: zynthian/README.md
        title: What the Zynthian directory holds

  - id: reference
    title: Reference
    blurb: The wire protocol first, then the format tables, using plugin-hostd from your own host, the panel and presets a plugin publishes, core placement, and the qualification records and pins elsewhere.
    entries:
      - page: protocol.md
        title: The wire protocol
      - page: formats.md
        title: "The format tables: how a scan becomes a descriptor"
      - page: own-host.md
        title: Use plugin-hostd in your own host
      - page: panel.md
        title: The panel a plugin publishes
      - page: presets.md
        title: Presets in the host
      - page: placement.md
        title: "Core placement: one worker per chain, pinned across the audio cores"
      - url: https://github.com/FreeMixer/plugin-qualify#readme
        title: Qualification records (plugin-qualify)
      - url: https://github.com/FreeMixer/plugin-hostd#pins
        title: Pins (README)
      - url: https://github.com/FreeMixer/omx-plugins/tree/main/docs/plugins
        title: The parameters of the omx plugins (omx-plugins)
        pending: true

  - id: evidence
    title: Evidence
    blurb: Every file under an evidence directory, grouped by topic and date, each with the pages that cite it.
    generated: evidence

  - id: project
    title: Project
    blurb: The mod-host fork the workers run, the design notes, how to contribute, and the licence, in that order.
    entries:
      - url: https://github.com/FreeMixer/mod-host
        title: The mod-host fork the LV2 workers run
      - url: https://github.com/FreeMixer/plugin-hostd/tree/main/docs/design
        title: The design notes (in the repository)
      - page: contributing.md
        title: How to contribute
      - url: https://github.com/FreeMixer/plugin-hostd/blob/main/COPYING
        title: "Licence: GPL-3.0-or-later"
